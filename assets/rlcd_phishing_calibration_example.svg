<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">RLCD 中文例子：邮件钓鱼识别</title>
  <desc id="desc">Illustrates an RLCD-style decision model with a phishing email example, probability calibration across a group, confidence-based routing, outcome scoring, and policy updates.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3976b8"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d17b28"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7854a5"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27836b"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#172b4d" flood-opacity="0.08"/></filter>
    <style>
      text { font-family: "Microsoft YaHei", Arial, sans-serif; fill: #182b45; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #61738a; }
      .lane { font-size: 15px; font-weight: 700; fill: #334c6b; letter-spacing: .4px; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 15; filter: url(#shadow); }
      .card-blue { fill: #f3f8fe; stroke: #8db3da; }
      .card-teal { fill: #f0faf7; stroke: #8ec8b6; }
      .card-orange { fill: #fff8ef; stroke: #e5ba87; }
      .card-purple { fill: #f8f5fc; stroke: #b6a0d3; }
      .card-green { fill: #f1f9f6; stroke: #91c3b3; }
      .card-warm { fill: #fffaf0; stroke: #d8c184; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; fill: #40536b; }
      .small { font-size: 13px; fill: #61738a; }
      .eq { font-size: 17px; font-weight: 600; fill: #243b58; }
      .tiny { font-size: 12px; fill: #61738a; }
      .badge { fill: #e8eef6; stroke: #ced9e5; stroke-width: 1; }
      .badge-text { font-size: 12px; font-weight: 700; fill: #49617e; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow-navy); }
      .arrow-blue { fill: none; stroke: #3976b8; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .arrow-orange { fill: none; stroke: #d17b28; stroke-width: 2.2; marker-end: url(#arrow-orange); }
      .arrow-purple { fill: none; stroke: #7854a5; stroke-width: 2.2; marker-end: url(#arrow-purple); }
      .arrow-green { fill: none; stroke: #27836b; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .rule { stroke: #dbe3ec; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>
  <text id="figure-heading" x="900" y="52" text-anchor="middle" class="title">RLCD 中文例子：邮件钓鱼识别</text>
  <text x="900" y="82" text-anchor="middle" class="subtitle">模型同时给出“判断结果”和“概率”，再用真实结果检验它的把握是否可信</text>

  <text x="60" y="133" class="lane">A  一次决策：从邮件内容到软件动作</text>
  <line x1="60" y1="147" x2="1740" y2="147" class="rule"/>

  <!-- email input -->
  <rect x="65" y="177" width="310" height="252" class="card card-blue"/>
  <rect x="86" y="196" width="82" height="25" rx="12" class="badge"/>
  <text x="127" y="213" text-anchor="middle" class="badge-text">输入样本</text>
  <text x="88" y="254" class="head">收到一封邮件</text>
  <text x="88" y="293" class="body">“请点击链接更新账户”</text>
  <text x="88" y="323" class="body">“否则账号将被停用”</text>
  <line x1="88" y1="345" x2="350" y2="345" class="rule"/>
  <text x="88" y="378" class="body">任务：判断邮件类型</text>
  <text x="88" y="406" class="small">候选：钓鱼邮件 / 正常邮件</text>

  <!-- probability output -->
  <rect x="420" y="177" width="390" height="252" class="card card-orange"/>
  <rect x="441" y="196" width="118" height="25" rx="12" class="badge"/>
  <text x="500" y="213" text-anchor="middle" class="badge-text">模型概率输出</text>
  <text x="443" y="254" class="head">这封邮件的概率分布</text>
  <text x="443" y="291" class="body">钓鱼邮件</text>
  <text x="780" y="291" text-anchor="end" class="eq">0.80</text>
  <rect x="443" y="303" width="335" height="19" rx="9" fill="#e8edf3"/>
  <rect x="443" y="303" width="268" height="19" rx="9" fill="#d17b28"/>
  <text x="443" y="351" class="body">正常邮件</text>
  <text x="780" y="351" text-anchor="end" class="eq">0.20</text>
  <rect x="443" y="363" width="335" height="19" rx="9" fill="#e8edf3"/>
  <rect x="443" y="363" width="67" height="19" rx="9" fill="#4b9b85"/>
  <text x="443" y="408" class="small">本次选择：钓鱼邮件；对应概率为 0.80</text>

  <!-- calibration cohort -->
  <rect x="855" y="177" width="380" height="252" class="card card-purple"/>
  <rect x="876" y="196" width="100" height="25" rx="12" class="badge"/>
  <text x="926" y="213" text-anchor="middle" class="badge-text">群体校准</text>
  <text x="878" y="254" class="head">看一批相似预测</text>
  <text x="878" y="293" class="body">汇总 100 封概率约为 0.80 的邮件</text>
  <rect x="878" y="312" width="326" height="48" rx="9" fill="#ffffff" stroke="#d8cde8"/>
  <text x="1041" y="342" text-anchor="middle" class="eq">约 80 封最终确认为钓鱼</text>
  <text x="878" y="393" class="small">校准良好时：0.80 ≈ 长期 80% 命中率</text>
  <text x="878" y="414" class="tiny">不是说眼前这一封必然是钓鱼邮件</text>

  <!-- application policy -->
  <rect x="1280" y="177" width="455" height="252" class="card card-green"/>
  <rect x="1301" y="196" width="105" height="25" rx="12" class="badge"/>
  <text x="1353" y="213" text-anchor="middle" class="badge-text">应用端策略</text>
  <text x="1303" y="254" class="head">按业务风险设置阈值</text>
  <text x="1303" y="292" class="body">p ≥ 0.95：自动拦截</text>
  <text x="1303" y="325" class="body">0.60 ≤ p &lt; 0.95：人工复核</text>
  <text x="1303" y="358" class="body">p &lt; 0.60：进入低风险流程</text>
  <rect x="1301" y="374" width="408" height="35" rx="8" fill="#e3f2ec"/>
  <text x="1505" y="397" text-anchor="middle" class="small" fill="#246953">本例 p=0.80 → 转人工复核</text>
  <text x="1303" y="422" class="tiny">阈值仅作示意，应按历史数据与误判成本确定</text>

  <path d="M375 303 L420 303" class="arrow-blue"/>
  <path d="M810 303 L855 303" class="arrow-purple"/>
  <path d="M1235 303 L1280 303" class="arrow-green"/>

  <text x="60" y="486" class="lane">B  结果揭晓后：奖励概率质量，更新模型</text>
  <line x1="60" y1="500" x2="1740" y2="500" class="rule"/>

  <!-- observed outcomes -->
  <rect x="65" y="548" width="465" height="240" class="card card-blue"/>
  <text x="90" y="584" class="head">真实结果成为训练目标 y*</text>
  <rect x="90" y="607" width="415" height="47" rx="8" fill="#ffffff" stroke="#d4e1ee"/>
  <text x="111" y="637" class="body">确认是钓鱼  →  y* = [1, 0]</text>
  <rect x="90" y="666" width="415" height="47" rx="8" fill="#ffffff" stroke="#d4e1ee"/>
  <text x="111" y="696" class="body">确认是正常  →  y* = [0, 1]</text>
  <text x="90" y="752" class="small">许多已标注样本共同提供反馈</text>

  <!-- distribution score -->
  <rect x="590" y="548" width="520" height="240" class="card card-purple"/>
  <text x="615" y="584" class="head">对概率分布打分</text>
  <text x="850" y="624" text-anchor="middle" class="eq">r(p, y*) = Log + 0.75 × Spherical</text>
  <text x="850" y="657" text-anchor="middle" class="body">score 类型另减 Ordinal RPS</text>
  <line x1="615" y1="675" x2="1085" y2="675" class="rule"/>
  <text x="615" y="709" class="body">奖励比较整组概率与真实结果</text>
  <text x="615" y="741" class="small">置信度越高但判断越错，惩罚越重</text>

  <!-- policy update -->
  <rect x="1170" y="548" width="565" height="240" class="card card-orange"/>
  <text x="1195" y="584" class="head">REINFORCE 策略更新</text>
  <text x="1195" y="624" class="body">同一输入采样多个候选概率分布</text>
  <text x="1452" y="659" text-anchor="middle" class="eq">A(k) = (r(k) − μ) / σr</text>
  <text x="1195" y="699" class="body">提高相对高奖励候选的概率</text>
  <text x="1195" y="741" class="small">在很多标注样本上重复，逐步学会何时自信</text>

  <path d="M530 668 L590 668" class="arrow-blue"/>
  <path d="M1110 668 L1170 668" class="arrow-purple"/>
  <path d="M1452 548 L1452 454 L615 454 L615 429" class="arrow-green"/>
  <text x="1035" y="446" text-anchor="middle" class="tiny" fill="#27836b">根据反馈更新模型参数</text>

  <!-- combined objective -->
  <rect x="390" y="846" width="1020" height="105" rx="15" class="card card-warm"/>
  <text x="900" y="883" text-anchor="middle" class="head">脚本中的联合训练目标</text>
  <text x="900" y="922" text-anchor="middle" class="eq">L = L_CE + λ · L_PG</text>
  <text x="900" y="943" text-anchor="middle" class="small">L_CE 对齐目标分布 y*；L_PG 按奖励更新采样策略</text>

  <rect x="65" y="1000" width="1670" height="135" rx="12" fill="#f7f9fc" stroke="#e0e7ef"/>
  <text x="90" y="1041" class="body"><tspan font-weight="700" fill="#334c6b">怎么理解 0.80：</tspan>如果许多相似案例都给出 0.80，且模型校准良好，其中大约 80% 会符合预测；单条预测仍可能错。</text>
  <text x="90" y="1077" class="body"><tspan font-weight="700" fill="#334c6b">怎么落地：</tspan>由业务方根据误报、漏报成本设阈值，把自动处理与人工复核分开。</text>
  <text x="90" y="1110" class="small">图中概率和阈值用于说明原理。该脚本是独立的 RLCD 风格示例；若训练目标来自教师模型，校准针对的是教师分布。</text>
</svg>
